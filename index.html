mutt\" target=\"_blank\" rel=\"noopener\">https://www.instagram.com/barlemutt</a></p>"}, {"lat": -33.041085, "lon": -71.627657, "name": "Café Paraíso", "html": "<p><strong>Tapas</strong></p><ul><li>Modo atardecer porteño: Mini pan de betarraga relleno con pollo cremoso y lechuga.</li><li>Modo paseo porteño: Mini croissant relleno con mozzarella, rúcula, tomate y pesto de pistacho.</li><li>Modo Pacífico: Mini croissant con vegetales frescos y aderezo de pesto.</li></ul><p><strong>Copas</strong></p><ul><li>Té frío de frambuesa con espuma de coco.</li><li>Pistacho tiramisú latte con espresso.</li><li>Bebida fría cítrica con curaçao azul.</li></ul><p><em>Dirección: Pasaje Gálvez 173, Cerro Concepción</em></p><p>📍 <strong>Cómo llegar</strong> <a href=\"https://maps.app.goo.gl/Bi2P6ukefHHvVwLF7\" target=\"_blank\" rel=\"noopener\">https://maps.app.goo.gl/Bi2P6ukefHHvVwLF7</a></p><p>👁️ <strong>Conoce más</strong> <a href=\"https://www.instagram.com/cafeparaiso3.0\" target=\"_blank\" rel=\"noopener\">https://www.instagram.com/cafeparaiso3.0</a></p>"}, {"lat": -33.04357860271372, "lon": -71.62759594907078, "name": "Casa Alegre", "html": "<p><strong>Tapas</strong></p><ul><li>Tartar de res y churrasca: Carne de res picada, mostaza, cebolla morada, cilantro fresco, limón, soya y pepinillos dill, sobre una crocante churrasca.</li><li>Morado y hummus: Sopaipillas de betarraga, acompañadas de hummus y encurtidos de la casa.</li></ul><p><strong>Copas</strong></p><ul><li>Cabernet atrevido: Sour de cabernet sauvignon con fresco rich de romero.</li><li>Mocktail: Shrub de manzana verde con toque de menta y jugo de frutilla.</li></ul><p><em>Dirección: Paseo Dimalow 249, Cerro Alegre</em></p><p>📍 <strong>Cómo llegar</strong> <a href=\"https://maps.app.goo.gl/pmygPygLnkbkX2D68\" target=\"_blank\" rel=\"noopener\">https://maps.app.goo.gl/pmygPygLnkbkX2D68</a></p><p>👁️ <strong>Conoce más</strong> <a href=\"https://www.instagram.com/casalegrevalparaiso\" target=\"_blank\" rel=\"noopener\">ht n toque de cilantro.</li></ul><p><strong>Copas</strong></p><ul><li><em>Chirimoya Alegre</em>: Cóctel de autor, frutal y refrescante a base de pisco, Chardonnay, naranja y chirimoya, con notas cítricas y espíritu de verano.</li><li><em>Vino Navegado</em>: Clásico chileno cálido y aromático a base de vino tinto, naranja y especias, con notas cítricas y especiadas que evocan una de las preparaciones más tradicionales de nuestra cultura.</li></ul><p><em>Dirección: Almirante Montt 438, Cerro Alegre</em></p><p>📍 <strong>Cómo llegar</strong> <a href=\"https://maps.app.goo.gl/QYHYPUFw4A6BsX7c9\" target=\"_blank\" rel=\"noopener\">https://maps.app.goo.gl/QYHYPUFw4A6BsX7c9</a></p><p>👁️ <strong>Conoce más</strong> <a href=\"https://www.instagram.com/espacioraizvalpo\" target=\"_blank\" rel=\"noopener\">https://www.instagram.com/espacioraizvalpo</a></p>"}, {"lat": -33.04282778295973, "lon": -71.6295811873079, "name": "Fat Kid", "html": "<p><strong>Tapa</strong></p><ul><li><em>Arancini Black Gold Baby</em>: Bola de risotto de champiñones apanada y frita, decorada con cebolla caramelizada y mayonesa trufada.</li></ul><p><strong>Copa</strong></p><ul><li><em>Despertar en Las Torpederas</em>: Vino Chardonnay, vodka de pera, syrup de canela y albúmina.</li></ul><p><em>Dirección: Lautaro Rosas 450, Cerro Alegre</em></p><p>📍 <strong>Cómo llegar</strong> <a href=\"https://maps.app.goo.gl/dyttRfHkYfBUhQPj8\" target=\"_blank\" rel=\"noopener\">https://maps.app.goo.gl/dyttRfHkYfBUhQPj8</a></p><p>👁️ <strong>Conoce más</strong> <a href=\"https://www.instagram.com/fatkidburgers\" target=\"_blank\" rel=\"noopener\">https://www.instagram.com/fatkidburgers</a></p>"}, {"lat": -33.043770574925276, "lon": -71.62694097235091, "name": "Fauna", "html": "<p><strong>Tapas</strong></p><ul><li>Tostada de foccacia con salmón ahumado a la naranja, encurtidos de la casa y lactonesa acevichada.</li><li>(Veg) Tostada con zucchini y peperonata, berenjena encurtida y mix de hojas y provenzal.</li></ul><p><strong ://maps.app.goo.gl/tbitRs13Q3xRkUQe7</a></p><p>👁️ <strong>Conoce más</strong> <a href=\"https://www.instagram.com/piano.cafe.valpo\" target=\"_blank\" rel=\"noopener\">https://www.instagram.com/piano.cafe.valpo</a></p>"}, {"lat": -33.042576, "lon": -71.626568, "name": "Planta Baja", "html": "<p><strong>Tapas</strong></p><ul><li>Ceviche local con pescado de roca, algas marinas, palta y ají verde.</li><li>Vegano: Falafel sobre estofado de vegetales al curry rojo y repollo morado encurtido.</li></ul><p><strong>Copas</strong></p><ul><li>Gin, licor de flores, jugo de limón, syrup de lavanda y agua tónica.</li><li>Mocktail: Infusión de té azul y flores, syrup de lavanda, agua tónica y gotas de limón.</li></ul><p><em>Dirección: Abtao 644, Cerro Concepción</em></p><p>📍 <strong>Cómo llegar</strong> <a href=\"https://maps.app.goo.gl/qn6Lhbjbjjfj96xy5\" target=\"_blank\" rel=\"noopener\">https://maps.app.goo.gl/qn6Lhbjbjjfj96xy5</a></p><p>👁️ <strong>Conoce más</strong> <a href=\"https://www.instagram.com/plantabaja_valpo\" target=\"_blank\" rel=\"noopener\">https://www.instagram.com/plantabaja_valpo</a></p>"}, {"lat": -33.042082345729284, "lon": -71.62724141025826, "name": "Quinto Rumbo", "html": "<p><strong>Tapas</strong></p><ul><li>Ssam de pollo frito, lechuga, hojas de cilantro, menta fresca y chimichurri, sweet chili de merkén y rabanitos encurtidos.</li><li>Opción vegan con berenjena frita.</li></ul><p><strong>Copas</strong></p><ul><li><em>Shrub spritz</em>: Macerado fermentado de piña albahaca o de mango ají verde y espumante brut.</li><li><em>Mocktail</em>: Macerado fermentado de piña albahaca o de mango ají verde y soda.</li></ul><p><em>Dirección: Pilcomayo 529</em></p><p>📍 <strong>Cómo llegar</strong> <a href=\"https://maps.app.goo.gl/9o77QR4Pc13MjG4T7\" target=\"_blank\" rel=\"noopener\">https://maps.app.goo.gl/9o77QR4Pc13MjG4T7</a></p><p>👁️ <strong>Conoce más</strong> <a href=\"https://www.instagram.com/quintorumbo.cocinaybar\" target=\"_blank\" rel=\"noopener\">https://www.instagram.com/quintorumbo.cocinaybar</a></p>"}, {"lat": -33.0438392, "lon": -71.626887, "name": "Terapia", "html": "<p><strong>Tapas</strong></p><ul><li>Canoa del puerto: Pejerrey frito, chalaca de algas ahumada, cremosa de palta-apio y emulsión de mango picante.</li></ul><p><strong>Copas</strong></p><ul><li>Aloha Fresh: Gin Casablanca con un dulce y suave cordial de pomelo rosado, terminado con agua tónica. Opción sin alcohol.</li></ul><p><em>Dirección: Paseo Dimalow 135, Cerro Alegre</em></p><p>📍 <strong>Cómo llegar</strong> <a href=\"https://maps.app.goo.gl/7yK1hdABpLiAKpsZ8\" target=\"_blank\" rel=\"noopener\">https://maps.app.goo.gl/7yK1hdABpLiAKpsZ8</a></p><p>👁️ <strong>Conoce más</strong> <a href=\"https://www.instagram.com/terapiavalpo\" target=\"_blank\" rel=\"noopener\">https://www.instagram.com/terapiavalpo</a></p>"}, {"lat": -33.04348, "lon": -71.6276535, "name": "Terrat", "html": "<p><strong>Tapas</strong></p><ul><li>Tortilla de papas artesanal.</li><li>Tartar de salmón marinado, sésamo, alcaparras, pepinillos y palta.</li><li>Tapa de tomate, oliva, perejil, ajo y jamón serrano sobre pan crujiente.</li></ul><p><strong>Copas</strong></p><ul><li>Sangría de la casa, Cerveza o Margarita.</li></ul><p><em>Dirección: Paseo Dimalow 263, Cerro Alegre</em></p><p>📍 <strong>Cómo llegar</strong> <a href=\"https://maps.app.goo.gl/DLkb6vWFbSx4Y2nV8\" target=\"_blank\" rel=\"noopener\">https://maps.app.goo.gl/DLkb6vWFbSx4Y2nV8</a></p><p>👁️ <strong>Conoce más</strong> <a href=\"https://www.instagram.com/terratvalpo\" target=\"_blank\" rel=\"noopener\">https://www.instagram.com/terratvalpo</a></p>"}, {"lat": -33.0403736, "lon": -71.6290517, "name": "Terruá Bistró", "html": "<p><strong>Tapas</strong></p><ul><li>Nortino: Brioche de queso de cabra, pesto y tomate cherry asado.</li><li>Chascona: Brioche de queso gouda, cebolla caramelizada, carne mechada y salsa demiglace.</li></ul><p><strong>Copas</strong></p><ul><li>Media noche: Spritz de licor de naranja casero y   var map = new maplibregl.Map({
    container: 'mapa',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [-71.6278, -33.0426],
    zoom: 16.3,
    attributionControl: true
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

  function limpiarEstilo() {
    var estilo = map.getStyle();
    var palabrasClaveMantener = ['road', 'highway', 'street', 'transportation', 'bridge', 'tunnel', 'path', 'ferry'];

    var capasFiltradas = estilo.layers.filter(function(capa) {
      var id = capa.id.toLowerCase();

      // Siempre mantener el fondo general
      if (capa.type === 'background') return true;

      // Mantener el relleno del agua (para orientación), pero no sus etiquetas
      if (id.indexOf('water') !== -1 && capa.type === 'fill') return true;

      // Mantener todo lo relacionado a calles/caminos (líneas y etiquetas de nombres)
      for (var i = 0; i < palabrasClaveMantener.length; i++) {
        if (id.indexOf(palabrasClaveMantener[i]) !== -1) return true;
      }

      // Todo lo demás (edificios, POIs, parques, límites, etiquetas de lugares, etc.) se quita
      return false;
    });

    estilo.layers = capasFiltradas;
    map.setStyle(estilo);
  }

  map.on('load', function() {
    limpiarEstilo();
    document.getElementById('loader').style.opacity = '0';
    setTimeout(function() {
      document.getElementById('loader').style.display = 'none';
    }, 300);
  });

  // fallback por si el evento 'load' no dispara a tiempo (ej. conexión lenta)
  setTimeout(function() {
    document.getElementById('loader').style.display = 'none';
  }, 6000);

  var svgPin = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 34" width="26" height="34">' +
    '<path d="M13 0C5.8 0 0 5.8 0 13c0 9.7 13 21 13 21s13-11.3 13-21C26 5.8 20.2 0 13 0z" fill="#2a7a6b" stroke="#fff" stroke-width="2"/>' +
    '<circle cx="13" cy="13" r="5" fill="#fff"/>' +
    '</svg>';

  locales.forEach(function(local) {
    var el = document.createElement('div');
    el.className = 'marcador-custom';
    el.innerHTML = svgPin;

    var popup = new maplibregl.Popup({ offset: 30, maxWidth: '280px' })
      .setHTML('<h3>' + local.name + '</h3>' + local.html);

    new maplibregl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat([local.lon, local.lat])
      .setPopup(popup)
      .addTo(map);
  });
</script>
