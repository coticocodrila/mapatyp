  var map = new maplibregl.Map({
    container: 'mapa',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [-71.6278, -33.0426],
    zoom: 16.3,
    attributionControl: true
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

  function limpiarEstilo() {
    var estilo = map.getStyle();
    var palabrasClaveMantener = ['road', 'highway', 'street', 'transportation', 'bridge', 'tunnel', 'path', 'ferry'];

    var capasFiltradas = estilo.layers.filter(function(capa) {
      var id = capa.id.toLowerCase();
      if (capa.type === 'background') return true;
      if (id.indexOf('water') !== -1 && capa.type === 'fill') return true;
      for (var i = 0; i < palabrasClaveMantener.length; i++) {
        if (id.indexOf(palabrasClaveMantener[i]) !== -1) return true;
      }
      return false;
    });

    // Pintamos el fondo de gris, sin tocar el color de las calles
    capasFiltradas.forEach(function(capa) {
      if (capa.type === 'background') {
        capa.paint = capa.paint || {};
        capa.paint['background-color'] = '#e3e3e3';
      }
    });

    estilo.layers = capasFiltradas;
    map.setStyle(estilo);
  }

  map.on('load', function() {
    limpiarEstilo();
    document.getElementById('loader').style.opacity = '0';
    setTimeout(function() {
      document.getElementById('loader').style.display = 'none';
    }, 300);
  });

  setTimeout(function() {
    document.getElementById('loader').style.display = 'none';
  }, 6000);

  var svgPin = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 34" width="26" height="34">' +
    '<path d="M13 0C5.8 0 0 5.8 0 13c0 9.7 13 21 13 21s13-11.3 13-21C26 5.8 20.2 0 13 0z" fill="#2a7a6b" stroke="#fff" stroke-width="2"/>' +
    '<circle cx="13" cy="13" r="5" fill="#fff"/>' +
    '</svg>';

  var popupActual = null;

  function cerrarPopupActual() {
    if (popupActual) {
      popupActual.remove();
      popupActual = null;
    }
  }

  // Si el usuario arrastra el mapa (con mouse o dedo), cerramos el popup abierto
  // en vez de dejar que "viaje" pegado al mapa
  map.on('dragstart', cerrarPopupActual);

  locales.forEach(function(local) {
    var el = document.createElement('div');
    el.className = 'marcador-custom';
    el.innerHTML = svgPin;

    var contenidoPopup = '<div class="popup-scroll">' + local.html + '</div>';

    var popup = new maplibregl.Popup({ offset: 30, maxWidth: '300px', closeOnClick: true })
      .setHTML(contenidoPopup);

    popup.on('open', function() {
      var scrollDiv = document.querySelector('.popup-scroll');
      if (scrollDiv) scrollDiv.scrollTop = 0;
      popupActual = popup;
    });

    popup.on('close', function() {
      if (popupActual === popup) popupActual = null;
    });

    el.addEventListener('click', function(ev) {
      ev.stopPropagation();
      cerrarPopupActual();
      // Centramos el mapa dejando más espacio arriba (donde aparece el popup)
      // que abajo, usando "padding" para que el pin quede en la mitad inferior
      // de la pantalla y el popup completo quepa por encima sin cortarse.
      map.flyTo({
        center: [local.lon, local.lat],
        zoom: Math.max(map.getZoom(), 17),
        speed: 1.4,
        curve: 1,
        padding: { top: 260, bottom: 40, left: 20, right: 20 }
      });
      popup.setLngLat([local.lon, local.lat]);
      popup.addTo(map);
    });

    new maplibregl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat([local.lon, local.lat])
      .addTo(map);
  });

  // ===== Intento de apertura en la app de Instagram (con respaldo automático a la web) =====
  document.addEventListener('click', function(e) {
    var link = e.target.closest ? e.target.closest('.ig-link') : null;
    if (!link) return;

    var username = link.getAttribute('data-user');
    if (!username) return; // sin username, dejamos que el link normal funcione

    e.preventDefault();
    var urlWeb = link.href;
    var urlApp = 'instagram://user?username=' + username;
    var inicio = Date.now();

    window.location = urlApp;

    // Si después de un momento seguimos aquí (la app no se abrió, ej. en un
    // computador o sin Instagram instalado), abrimos la versión web como respaldo
    setTimeout(function() {
      if (Date.now() - inicio < 2000) {
        window.open(urlWeb, '_blank');
      }
    }, 1200);
  });
</script>
