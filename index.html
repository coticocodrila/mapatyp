<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Tapas y Copas - Cerro Alegre y Cerro Concepción</title>
<link rel="preconnect" href="https://tiles.openfreemap.org">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #mapa { width: 100%; height: 100vh; background: #eeeeee; }

  #loader {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; background: #eeeeee; z-index: 9999;
    color: #666; transition: opacity 0.3s ease;
  }
  .spinner {
    width: 36px; height: 36px; border: 4px solid #ccc; border-top-color: #2a7a6b;
    border-radius: 50%; animation: girar 0.8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ===== Marcador con etiqueta visible tipo uMap ===== */
  .marcador-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .marcador-etiqueta {
    background: rgba(255,255,255,0.92);
    color: #6b6b6b;
    font-size: 11.5px;
    font-weight: 300;
    letter-spacing: 0.015em;
    padding: 2px 7px;
    border-radius: 5px;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    margin-bottom: -9px; /* se superpone sobre el pin para verse mejor */
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    position: relative;
    z-index: 5; /* siempre por encima del pin, y por encima de pines vecinos */
  }
  .marcador-pin { width: 29px; height: 36px; position: relative; z-index: 1; }
  .marcador-logo {
    width: 20px;
    height: 20px;
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    pointer-events: none;
  }

  /* ===== Modal centrado (independiente del mapa) ===== */
  /* El "backdrop" ya NO cubre ni bloquea el mapa: solo sirve como contenedor
     posicionador. pointer-events:none dejar pasar los clics al mapa; la tarjeta
     en sí (#modal-card) sí captura sus propios clics. */
  #modal-backdrop {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #modal-backdrop.activo {
    opacity: 1;
  }
  #modal-card {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    max-width: 320px;
    max-height: 70vh;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    transform: translateY(12px);
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
    pointer-events: none;
  }
  #modal-backdrop.activo #modal-card {
    transform: translateY(0);
    pointer-events: all;
  }
  /* #modal-content es el único hijo directo de #modal-card, y por eso DEBE
     heredar el mismo comportamiento flex; si no, las reglas de "encogerse y
     mostrar scroll" del contenido interno nunca llegan a aplicarse. */
  #modal-content {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }

  .popup-header {
    background: #d05985;
    padding: 16px 44px 16px 20px;
    position: relative;
    flex-shrink: 0;
  }
  .popup-header h3 {
    margin: 0; color: #fff; font-size: 17px; font-weight: 600;
    line-height: 1.3; word-break: break-word;
  }
  .popup-close {
    position: absolute;
    top: 8px; right: 10px;
    width: 30px; height: 30px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 20px;
    border-radius: 50%;
    cursor: pointer;
    line-height: 1;
  }
  .popup-close:hover { background: rgba(255,255,255,0.35); }

  /* ===== Header del modal de registro: logo + título (no afecta .popup-header base) ===== */
  #registro-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #registro-logo {
    height: 30px;
    width: auto;
    flex-shrink: 0;
  }

  /* ===== Popup de bienvenida/aviso (imagen, se muestra antes que el mapa) ===== */
  #bienvenida-backdrop {
    position: fixed;
    inset: 0;
    z-index: 11000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #bienvenida-backdrop.activo { opacity: 1; pointer-events: all; }
  #bienvenida-card {
    position: relative;
    max-width: 480px;
    width: 100%;
    max-height: 85vh;
    transform: scale(0.96);
    transition: transform 0.25s ease;
  }
  #bienvenida-backdrop.activo #bienvenida-card { transform: scale(1); }
  #bienvenida-card img {
    width: 100%;
    height: auto;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 12px;
    display: block;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  #bienvenida-cerrar {
    position: absolute;
    top: 10px; right: 10px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: #fff;
    color: #333;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    line-height: 1;
    z-index: 1;
  }
  #bienvenida-cerrar:hover { background: #f0f0f0; }

  .popup-scroll {
    overflow-y: auto;
    overflow-x: hidden;
    flex: 1 1 auto;
    min-height: 0; /* imprescindible para que el scroll interno funcione dentro de flexbox */
    -webkit-overflow-scrolling: touch; /* scroll con inercia en iOS */
    touch-action: pan-y; /* le dice explícitamente al navegador: este elemento se desplaza verticalmente */
    overscroll-behavior: contain; /* evita que el "rebote" del scroll se filtre hacia el mapa de fondo */
  }
  .popup-body { padding: 16px 20px 4px 20px; }
  .popup-section { margin-bottom: 16px; }
  .popup-label {
    font-size: 12.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: #d05985; margin-bottom: 6px;
  }
  .popup-section ul { margin: 0; padding-left: 20px; list-style: disc; }
  .popup-section li { font-size: 14px; line-height: 1.5; color: #333; margin-bottom: 3px; word-wrap: break-word; }
  .popup-direccion {
    font-size: 13px; color: #666; line-height: 1.5; padding: 10px 0 16px 0;
    border-top: 1px solid #eee; word-wrap: break-word;
  }
  .popup-actions {
    display: flex; gap: 8px; padding: 12px 20px 18px 20px; flex-shrink: 0;
  }
  .popup-btn {
    flex: 1; text-align: center; padding: 10px 8px; border-radius: 8px;
    font-size: 13px; font-weight: 600; text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity 0.15s ease;
  }
  .popup-btn:hover { opacity: 0.85; }
  .popup-btn-primary { background: #d05985; color: #fff; }
  .popup-btn-outline { background: #fff; color: #d05985; border: 1.5px solid #d05985; }

  /* ===== Contenedor de botones flotantes (agrupa "Sitio web" + "Únete a la ruta") ===== */
  /* Wrapper nuevo, no modifica el estilo ni comportamiento ya aprobado del botón de registro;
     solo lo agrupa junto al nuevo botón para poder ubicarlos lado a lado, centrados. */
  #botones-flotantes {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 9000;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ===== Botón flotante "Únete a la ruta" (registro de usuarios) ===== */
  #btn-registro {
    background: #d05985;
    color: #fff;
    border: none;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  #btn-registro:hover { opacity: 0.92; }

  /* ===== Botón flotante "Sitio web" (nuevo) ===== */
  #btn-sitio {
    background: #fff;
    color: #d05985;
    border: 1.5px solid #d05985;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    text-decoration: none;
  }
  #btn-sitio:hover { opacity: 0.85; }

  /* ===== Modal de registro (independiente del modal de locales) ===== */
  #registro-backdrop {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    background: rgba(0,0,0,0.25);
  }
  #registro-backdrop.activo { opacity: 1; pointer-events: all; }
  #registro-card {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    max-width: 340px;
    max-height: 85vh;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    transform: translateY(12px);
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
  }
  #registro-backdrop.activo #registro-card { transform: translateY(0); }
  .registro-scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .registro-body { padding: 18px 20px 20px 20px; }
  .registro-body p.registro-intro {
    font-size: 13px; color: #555; line-height: 1.5; margin: 0 0 14px 0;
  }
  .registro-campo { margin-bottom: 12px; }
  .registro-campo label {
    display: block; font-size: 12px; font-weight: 700; color: #d05985;
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 5px;
  }
  .registro-campo input {
    width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px;
    border: 1.5px solid #ddd; border-radius: 8px; font-family: inherit;
  }
  .registro-campo input:focus { outline: none; border-color: #d05985; }
  .registro-consentimiento {
    display: flex; gap: 8px; align-items: flex-start; margin: 14px 0 4px 0;
  }
  .registro-consentimiento input { margin-top: 3px; flex-shrink: 0; }
  .registro-consentimiento label { font-size: 12px; color: #555; line-height: 1.45; }
  .registro-msg { font-size: 13px; margin-top: 10px; line-height: 1.4; }
  .registro-msg.exito { color: #d05985; font-weight: 600; }
  .registro-msg.error { color: #b23b3b; font-weight: 600; }
  #registro-submit {
    width: 100%; margin-top: 14px; padding: 11px; border: none; border-radius: 8px;
    background: #d05985; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #registro-submit:disabled { opacity: 0.6; cursor: default; }
  #registro-submit:hover:not(:disabled) { opacity: 0.9; }
</style>
</head>

  // En pantallas anchas (computador) se ve mucho más área geográfica que en un
  // celular con el mismo nivel de zoom, así que lo compensamos según el ancho real
  var anchoPantalla = window.innerWidth;
  var zoomInicial = anchoPantalla > 900 ? 17.4 : 16.3;

  var map = new maplibregl.Map({
    container: 'mapa',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [-71.6278, -33.0426],
    zoom: zoomInicial,
    attributionControl: true,
    dragRotate: false,      // bloquea el giro con clic derecho / dos dedos + arrastre
    pitchWithRotate: false, // evita que el gesto de inclinar también gire el mapa
    touchPitch: false       // evita la inclinación 3D por gesto táctil
  });

  // Refuerzo: bloquea también el giro con gesto táctil de pellizco-rotar
  // (deja el zoom con pellizco intacto) y con teclado (Shift + flechas).
  map.touchZoomRotate.disableRotation();
  map.keyboard.disableRotation();

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

  // Botón para ubicar al usuario en el mapa
  map.addControl(new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true,
    showUserHeading: true
  }), 'top-right');

  function limpiarEstilo() {
    var estilo = map.getStyle();
    var palabrasClaveMantener = ['road', 'highway', 'street', 'transportation', 'bridge', 'tunnel', 'path', 'ferry', 'pedestrian', 'service', 'residential', 'track', 'cycle', 'steps', 'trail', 'walkway', 'lane', 'motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor', 'major'];

    var capasFiltradas = estilo.layers.filter(function(capa) {
      var id = capa.id.toLowerCase();
      if (capa.type === 'background') return true;
      if (id.indexOf('water') !== -1 && capa.type === 'fill') return true;
      for (var i = 0; i < palabrasClaveMantener.length; i++) {
        if (id.indexOf(palabrasClaveMantener[i]) !== -1) return true;
      }
      return false;
    });

    capasFiltradas.forEach(function(capa) {
      if (capa.type === 'background') {
        capa.paint = capa.paint || {};
        capa.paint['background-color'] = '#eeeeee';
      }
      if (capa.id.toLowerCase().indexOf('water') !== -1 && capa.type === 'fill') {
        capa.paint = capa.paint || {};
        capa.paint['fill-color'] = '#dddddd';
      }
    });

    // Reemplazamos cualquier color (incluido el amarillo típico de calles
    // secundarias) por una paleta de grises, según la importancia de la vía
    capasFiltradas.forEach(function(capa) {
      if (capa.type === 'line') {
        capa.paint = capa.paint || {};
        var id = capa.id.toLowerCase();
        if (id.indexOf('motorway') !== -1 || id.indexOf('trunk') !== -1) {
          capa.paint['line-color'] = '#8f8f8f';
        } else if (id.indexOf('primary') !== -1) {
          capa.paint['line-color'] = '#a8a8a8';
        } else {
          capa.paint['line-color'] = '#c5c5c5';
        }
      }
      if (capa.type === 'symbol' && capa.paint && capa.paint['text-color']) {
        capa.paint['text-color'] = '#6a6a6a';
        capa.paint['text-halo-color'] = '#ffffff';
        capa.paint['text-halo-width'] = 1.2;
      }
    });

    estilo.layers = capasFiltradas;
    map.setStyle(estilo);
  }

  map.on('load', function() {
    limpiarEstilo();
    document.getElementById('loader').style.opacity = '0';
    setTimeout(function() {
      document.getElementById('loader').style.display = 'none';
    }, 300);
  });

  setTimeout(function() {
    document.getElementById('loader').style.display = 'none';
  }, 6000);

  // ===== Tarjeta fija en pantalla, con el mapa siempre interactivo detrás =====
  var modalBackdrop = document.getElementById('modal-backdrop');
  var modalContent = document.getElementById('modal-content');
  var popupAbierto = false;

  function abrirPopup(htmlContenido) {
    modalContent.innerHTML = htmlContenido;
    modalBackdrop.classList.add('activo');
    popupAbierto = true;
    // Esperamos un frame a que el navegador termine de dibujar el contenido
    // nuevo antes de resetear el scroll — así el "inicio desde arriba" es 100% confiable
    requestAnimationFrame(function() {
      var scrollDiv = modalContent.querySelector('.popup-scroll');
      if (scrollDiv) scrollDiv.scrollTop = 0;
    });
  }

  function cerrarPopup() {
    modalBackdrop.classList.remove('activo');
    popupAbierto = false;
  }

  // 1) Cerrar al tocar fuera de la tarjeta (en cualquier parte, incluido el mapa)
  document.addEventListener('click', function(e) {
    if (!popupAbierto) return;
    var card = document.getElementById('modal-card');
    var esUnPin = e.target.closest ? e.target.closest('.marcador-wrap') : null;
    if (!card.contains(e.target) && !esUnPin) {
      cerrarPopup();
    }
  });

  // 2) Cerrar al arrastrar o hacer zoom en el mapa (el mapa queda libre para navegar)
  map.on('dragstart', function() {
    if (popupAbierto) cerrarPopup();
  });
  map.on('zoomstart', function(e) {
    // Ignoramos el zoom que a veces dispara el propio navegador al abrir/cerrar
    // teclado en inputs; solo nos importa el zoom manual del usuario (pellizco/rueda)
    if (popupAbierto && e.originalEvent) cerrarPopup();
  });

  var svgPin = '<svg class="marcador-pin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 32" width="29" height="36">' +
    '<path d="M6,2 H20 A4,4 0 0 1 24,6 V16 A4,4 0 0 1 20,20 H16 Q13,20 13,24 Q13,20 10,20 H6 A4,4 0 0 1 2,16 V6 A4,4 0 0 1 6,2 Z" fill="#7c294b"/>' +
    '</svg>';

  var LOGO_BASE64 = 'iVBORw0KGgoAAAANSUhEUgAAAFAAAABQCAYAAACOEfKtAAAACXBIWXMAAAsSAAALEgHS3X78AAAE+klEQVR4nO2b7ZWbOBSGn9mz/8cdDKkgTgWhgzgVDK5gvBWMU8HOVBBSwXoqWFJBcAekA7sC7Q+hBWODkC4ynnP0nMMxxkIfL5Lu1RW+U0oR8eePuSvw3okCCokCCokCCokCCokCCokCCokCCokCCokCCokCCokCCokCCokCCokCCvlz7grcMEl9LIBlfS0HqnaisQKazNLO9aI+3jtpfSzR7fzYk+4AvJxcUUoNHZlS6qCGWVnyuNUjU0rtLG3rsu3mY+uBCXBvSZPX6Q6WdLfCFthgb9cobEYkHZHHPbpSt84SKIFnJhIPpjMiT8CO250Pl+i6uQp3RIteokdY3k1wp4Z35SrgYWRhexprJWWJtn7QGLCi/l6cpR5mgW6Hi3g/0cZiZ01pmWhd2Qgm9YVS6kXZjZZSevLP6nts+eYO9T8oR6Noa5ArB6XU0qUC9bFUSlUe5SmlRe/LNwld96EfU88GKaXFMD2pVBfMf+tYKH/xDHlP3i69Lx2oo5OAC6WHYilsVJe+SkxVTlcAlxHU9wCsR9sKL9D+0WQ+Uot9z/Ut/V6/KxtODUzmcK/dWPRgrPAG3ZiphTP85LJPeZiwzCON5QYt5ueR9975FmoEdClsDHsa/6moP7ssgV8TlgnwgWax7/LWlLeAZghXnAp4RPeOsT5glzH+4MKe5IxX9HD7t+f3BN2W1DHfBZ5LUbOUK4EfwBr9FBe4zSHXIudyb+7i+nAy55rUmB74MpgqDGOE6LJiuKcU9afrimiL7tmVa4XmDKj6DJnngd/efCuCNmQF+gE5Pdi5Q/q/J8xLOooe0EYtx6EHzx3SL/E3VG1emS4S9Fgf0ERjDIfW9xyoQi3lxnrymaAMQxkoXxsopWYfwjmyYfzGZZelEuTpxNwCgp64fVjTb5UL79o4cgsC+gRhv3EhOtxBYpVtHM3JkIBpwAq0yTzuKUakCenb/m9YQvXAMSuBpK6Izxr8ZUQZBTqIEZRQAtqGpXFYfUNZHxkXgtp45j+aOebAFfAP8jDWZ86nmRW6d2b19xJtbKamMifXdqSX2Cd/F9pB1KTO2zyYFC1kXv82tAx0pTIn1+6BL0wbtP2CbkzGqXigVxN5fb4lTE+8qoAZ0wZtDQ/A9568H2nemsiBT/RvL3gRSsD0wjWXCf038JWWvyWgXW6JnkbWyFZAwd2YLgnjLe5bnX6H/yqlzaWVSl6X8QntlI9xd/Y0QefCXAxlRBLL9yHaDS6Av4C/BXUZeghm38bQfpnSUDGwtr6WgKnDvStO9yiMW+LjM37DLUB6wHEdHWoIJ4J77zl3dQrPvHzvG00oAaVB0i9o65miRXjyzCcT1sNKSCPSnkt8NpCe0duXEtfnkcAbZiEFTFrnVcBybDwRsCdeswdOuYHkynemcYnOuJaAMP/rv1O9PXtCSAG78bo5Nu+DEzIi3Z38S64Q4OzhiOAVtiFCL+WSzvepA5x79NLqK8NBghQ/T8DKtQUs0asDKSbYYOKLO7RIl0RcE0g8CC9geuHaFr0o9+UVLVx3SB44F3HNtAHcM0JHpJOe6xnNSiPh/H8h3ZWMecViy7A1NyJmNC93BiW0gEM7ZxVhesf5PyoDMvRPpYzTHtR+saZLMVmN3hm2v3pFLNzCqx3vmiigkCigkCigkCigkCigkCigkCigkCigkCigkCigkCigkCigkCigkP8As0hfdP8r7/EAAAAASUVORK5CYII=';

  // ===== Orden de apilamiento entre marcadores vecinos =====
  // Cada marcador (etiqueta + pin) es un solo elemento posicionado con
  // transform, así que compite con sus vecinos por z-index como una
  // unidad. Para que las etiquetas no queden tapadas por el pin de un
  // local vecino (sin mover ningún pin de su lugar), ordenamos los
  // marcadores de norte a sur y les damos un z-index creciente: los
  // locales más al sur (que se ven más abajo en el mapa) quedan "más
  // adelante" y su etiqueta, que sobresale hacia arriba, pasa por
  // encima del pin del vecino de más al norte.
  var localesPorLatitud = locales.slice().sort(function(a, b) { return b.lat - a.lat; });
  var zIndexPorLocal = {};
  localesPorLatitud.forEach(function(local, i) {
    zIndexPorLocal[local.name] = i + 1;
  });

  locales.forEach(function(local) {
    var wrap = document.createElement('div');
    wrap.className = 'marcador-wrap';
    wrap.style.zIndex = zIndexPorLocal[local.name];

    var etiqueta = document.createElement('div');
    etiqueta.className = 'marcador-etiqueta';
    etiqueta.textContent = local.name;
    wrap.appendChild(etiqueta);

    // Contenedor del pin: el SVG de fondo + el logo superpuesto
    var pinBox = document.createElement('div');
    pinBox.style.position = 'relative';
    pinBox.innerHTML = svgPin;

    var logoImg = document.createElement('img');
    logoImg.src = 'data:image/png;base64,' + LOGO_BASE64;
    logoImg.className = 'marcador-logo';
    pinBox.appendChild(logoImg);

    wrap.appendChild(pinBox);

    wrap.addEventListener('click', function(ev) {
      ev.stopPropagation();
      abrirPopup(local.html);
    });

    new maplibregl.Marker({ element: wrap, anchor: 'bottom' })
      .setLngLat([local.lon, local.lat])
      .addTo(map);
  });

  // ===== Intento de apertura en la app de Instagram (con respaldo automático a la web) =====
  document.addEventListener('click', function(e) {
    var link = e.target.closest ? e.target.closest('.ig-link') : null;
    if (!link) return;

    var username = link.getAttribute('data-user');
    if (!username) return;

    e.preventDefault();
    var urlWeb = link.href;
    var urlApp = 'instagram://user?username=' + username;
    var inicio = Date.now();

    window.location = urlApp;

    setTimeout(function() {
      if (Date.now() - inicio < 2000) {
        window.open(urlWeb, '_blank');
      }
    }, 1200);
  });
</script>

<!-- ===== Script nuevo e independiente: registro de usuarios ===== -->
<!-- No modifica ni depende del script del mapa de arriba. -->
<script>
(function() {
  // TODO: reemplaza esta URL por la de tu Google Apps Script Web App
  // (ver instrucciones de despliegue que te entrego aparte).
  var URL_REGISTRO = 'https://script.google.com/macros/s/AKfycbyUHuJuYriWAsTf1e57pTw2lB-P7r-SHc8JERF-1KC0f2tlNuJhSMeuRuSohbrWlE4/exec';

  var btnAbrir = document.getElementById('btn-registro');
  var backdrop = document.getElementById('registro-backdrop');
  var btnCerrar = document.getElementById('registro-cerrar');
  var form = document.getElementById('form-registro');
  var msg = document.getElementById('registro-msg');
  var submitBtn = document.getElementById('registro-submit');

  function abrirRegistro() {
    backdrop.classList.add('activo');
  }
  function cerrarRegistro() {
    backdrop.classList.remove('activo');
  }

  btnAbrir.addEventListener('click', abrirRegistro);
  btnCerrar.addEventListener('click', cerrarRegistro);
  backdrop.addEventListener('click', function(e) {
    if (e.target === backdrop) cerrarRegistro();
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    msg.textContent = '';
    msg.className = 'registro-msg';

    var datos = {
      nombre: document.getElementById('reg-nombre').value.trim(),
      email: document.getElementById('reg-email').value.trim(),
      ciudad: document.getElementById('reg-ciudad').value.trim(),
      consentimiento: document.getElementById('reg-consentimiento').checked,
      fecha: new Date().toISOString()
    };

    if (!datos.nombre || !datos.email || !datos.ciudad) {
      msg.textContent = 'Por favor completa todos los campos.';
      msg.classList.add('error');
      return;
    }
    if (!datos.consentimiento) {
      msg.textContent = 'Debes aceptar el uso de tus datos para continuar.';
      msg.classList.add('error');
      return;
    }
    if (URL_REGISTRO.indexOf('TU_ID_DE_DESPLIEGUE') !== -1) {
      msg.textContent = 'Falta configurar la URL de destino (ver instrucciones).';
      msg.classList.add('error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    fetch(URL_REGISTRO, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(datos)
    })
      .then(function(res) { return res.json(); })
      .then(function(res) {
        if (res && res.status === 'ok') {
          form.reset();
          msg.textContent = '¡Gracias! Te avisaremos de novedades pronto.';
          msg.classList.add('exito');
          setTimeout(cerrarRegistro, 1800);
        } else {
          throw new Error('Respuesta inesperada');
        }
      })
      .catch(function() {
        msg.textContent = 'Hubo un problema al enviar tus datos. Intenta de nuevo.';
        msg.classList.add('error');
      })
      .finally(function() {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar';
      });
  });
})();
</script>

<!-- ===== Script nuevo e independiente: popup de bienvenida/aviso ===== -->
<script>
(function() {
  var backdrop = document.getElementById('bienvenida-backdrop');
  var btnCerrar = document.getElementById('bienvenida-cerrar');
  var CLAVE_VISTO = 'bienvenida_tapasycopas_vista';

  function cerrarBienvenida() {
    backdrop.classList.remove('activo');
    try { localStorage.setItem(CLAVE_VISTO, '1'); } catch (err) {}
  }

  // Se muestra automáticamente al cargar la página, solo si el visitante no la ha visto antes
  window.addEventListener('load', function() {
    var yaVisto = false;
    try { yaVisto = localStorage.getItem(CLAVE_VISTO) === '1'; } catch (err) {}
    if (!yaVisto) {
      backdrop.classList.add('activo');
    }
  });

  btnCerrar.addEventListener('click', cerrarBienvenida);
  backdrop.addEventListener('click', function(e) {
    if (e.target === backdrop) cerrarBienvenida();
  });
})();
</script>
